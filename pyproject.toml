[project]
name = "mystic-cli"
version = "2.0.0"
description = "Mystic CLI — AI agent with skills, dashboard and Discord bot (optimized rebuild)"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "aiohttp>=3.9",
  "aiosqlite>=0.19",
  "psutil>=5.9",
  "discord.py>=2.3",
  "python-dotenv>=1.0",
  "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
